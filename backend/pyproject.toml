[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lifecare-local-api"
version = "0.1.0"
description = "Local-first API for the medication tracker"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.routes", "app.core", "app.db"]
